services:
  # FastAPI Web Server
  api:
    build: .
    image: ai_os_app:latest
    container_name: ai_os_api
    restart: always
    env_file:
      - .env
    environment:
      INNGEST_API_BASE_URL: http://inngest:8288
      INNGEST_EVENT_API_BASE_URL: http://inngest:8288
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Background Worker for document ingestion & chat jobs
  worker:
    image: ai_os_app:latest
    container_name: ai_os_worker
    restart: always
    env_file:
      - .env
    command: python -m app.worker
    depends_on:
      - api

  # Inngest local server for durable background functions
  inngest:
    image: node:22-alpine
    container_name: ai_os_inngest
    restart: always
    command: >
      sh -c "npx --yes inngest-cli@latest dev --no-discovery -u http://api:8000/api/inngest"
    ports:
      - "8288:8288"
    depends_on:
      - api
